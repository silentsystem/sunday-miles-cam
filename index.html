<!doctype html>
<html lang="it">
<head>

<style>
/* Layout: full-bleed camera stage, controls float on the bottom safe area like a native camera */
:root{
  --ink:#0d0d0d; --paper:#ffffff; --orange:#ff6a13; --visor:#1f9d57; --smoke:rgba(13,13,13,.62);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
[hidden]{display:none!important}

#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink)}
#out{width:100%;height:100%;object-fit:cover;display:block}

.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--smoke),transparent);pointer-events:none}
.top > *{pointer-events:auto}
.wordmark{font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;letter-spacing:.02em;line-height:1;
  display:flex;flex-direction:column}
.wordmark small{font-family:var(--body);font-style:normal;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-top:3px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--smoke);display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[aria-pressed="false"]{opacity:.55}

.hint{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);background:var(--smoke);padding:10px 16px;border-radius:999px;
  font-weight:600;font-size:15px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}

.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:24px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,var(--smoke))}
.row{display:flex;align-items:center;justify-content:center;gap:44px;width:100%}
.tip{font-size:13px;font-weight:600;letter-spacing:.04em;opacity:.85}
#shutter{position:relative;width:84px;height:84px;border-radius:50%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#shutter .ring{position:absolute;inset:0;border-radius:50%;border:5px solid var(--paper)}
#shutter .core{position:absolute;inset:11px;border-radius:50%;background:var(--orange);transition:transform .2s,border-radius .2s}
#shutter.rec .core{transform:scale(.62);border-radius:14px;background:#ff2d2d}
#shutter svg{position:absolute;inset:-6px;width:96px;height:96px;transform:rotate(-90deg)}
#shutter circle{fill:none;stroke:var(--orange);stroke-width:5;stroke-linecap:round}
#timer{font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;color:#ff2d2d;min-height:24px}

/* start + result sheets */
.sheet{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px,env(safe-area-inset-left,0px));
  background:var(--ink)}
.start{background:
  var(--ink)}
.start img{width:min(62vw,300px);height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.start h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(40px,11vw,64px);line-height:.9;margin:0;text-wrap:balance;text-transform:uppercase}
.start h1 span{color:var(--orange)}
.start p{margin:0;max-width:30ch;font-size:16px;line-height:1.45;opacity:.85}
.cta{background:var(--orange);color:var(--ink);font-weight:700;font-size:18px;padding:16px 30px;border-radius:999px;min-width:240px}
.cta:disabled{opacity:.5}
.ghost{background:transparent;border:2px solid rgba(255,255,255,.35);color:var(--paper);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px}
.err{color:#ffb38a;font-weight:600;max-width:32ch}
.small{font-size:12px;opacity:.6;letter-spacing:.03em}

.result{gap:16px;justify-content:space-between}
.result .media{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.result .media img,.result .media video{max-width:100%;max-height:100%;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.actions .cta{min-width:0;flex:1 1 140px;max-width:220px}
.actions .ghost{flex:1 1 100px;max-width:160px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);transform:translateX(-50%);background:var(--paper);color:var(--ink);
  font-weight:700;padding:10px 18px;border-radius:999px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<div id="stage"><canvas id="out"></canvas></div>

<header class="top" id="topbar" hidden>
  <div class="wordmark">SUNDAY MILES<small>Silent System</small></div>
  <div style="display:flex;gap:10px">
    <button class="iconbtn" id="suitBtn" aria-pressed="true" aria-label="Mostra o nascondi la giacca" title="Giacca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3l4 5 4-5 5 3-2 15H5L3 6z"/><path d="M12 8v13"/></svg>
    </button>
    <button class="iconbtn" id="flipBtn" aria-label="Cambia fotocamera" title="Cambia fotocamera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2"/><path d="M14 9v2h-2M10 17v-2h2"/></svg>
    </button>
  </div>
</header>

<div class="hint" id="hint" hidden>Inquadra il viso</div>

<footer class="bottom" id="controls" hidden>
  <div id="timer"></div>
  <div class="row">
    <button id="shutter" aria-label="Tocca per la foto, tieni premuto per il video">
      <span class="ring"></span><span class="core"></span>
      <svg viewBox="0 0 96 96"><circle id="prog" cx="48" cy="48" r="45" stroke-dasharray="283" stroke-dashoffset="283"/></svg>
    </button>
  </div>
  <div class="tip">Tocca per la foto · Tieni premuto per il video</div>
</footer>

<section class="sheet start" id="start">
  <img src="assets/cover.webp" alt="Sunday Miles Osetti con visiera Silent System e cuffie">
  <h1>Diventa<br><span>Sunday Miles</span></h1>
  <p>La sua faccia segue la tua: parla, sorridi, gira la testa. Registra, salva e condividi su TikTok e Instagram.</p>
  <button class="cta" id="startBtn" disabled>Caricamento…</button>
  <div class="err" id="startErr" hidden></div>
  <div class="small">Funziona nel browser. Nessuna foto viene caricata online.</div>
</section>

<section class="sheet result" id="result" hidden>
  <div class="media" id="media"></div>
  <div class="actions">
    <button class="cta" id="shareBtn">Condividi</button>
    <button class="ghost" id="saveBtn">Salva</button>
    <button class="ghost" id="againBtn">Rifai</button>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const out = $('out'), ctx = out.getContext('2d');
const video = document.createElement('video');
video.playsInline = true; video.muted = true; video.autoplay = true; video.setAttribute('playsinline',''); video.setAttribute('muted','');
video.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1';
document.body.appendChild(video);
let lastLms = null, lmsAt = 0;

let model, IMG = {}, landmarker = null, FaceLandmarker = null, camStream = null, micTrack = null;
let facing = 'user', showSuit = true, running = false, busy = false;
let smooth = null, smoothAff = null, lastFaceAt = 0;

/* ---------- assets ---------- */
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
async function loadAssets(){
  model = await (await fetch('assets/model.json')).json();
  [IMG.head, IMG.face, IMG.suit] = await Promise.all(['assets/head.webp','assets/face.webp','assets/suit.webp'].map(loadImg));
}

/* ---------- WebGL face warp ---------- */
const glc = document.createElement('canvas');
const gl = glc.getContext('webgl', {premultipliedAlpha:true, alpha:true, antialias:true});
let prog, posBuf, idxCount, aPos, aUV, aA, uRes;
const N = 468;
function initGL(){
  const vs = `attribute vec2 p;attribute vec2 t;attribute float a;uniform vec2 r;varying vec2 vt;varying float va;
    void main(){vt=t;va=a;vec2 c=p/r*2.0-1.0;gl_Position=vec4(c.x,-c.y,0,1);}`;
  const fs = `precision mediump float;uniform sampler2D s;varying vec2 vt;varying float va;
    void main(){gl_FragColor=texture2D(s,vt)*va;}`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  aPos = gl.getAttribLocation(prog,'p'); aUV = gl.getAttribLocation(prog,'t'); aA = gl.getAttribLocation(prog,'a'); uRes = gl.getUniformLocation(prog,'r');

  const oval = model.oval, F = model.face, L = model.lm;
  const cc = centroid(oval.map(i => L[i]));
  const charPts = L.slice(0, N).concat(oval.map(i => expand(L[i], cc, 1.16)));
  const uv = new Float32Array(charPts.length * 2), al = new Float32Array(charPts.length);
  charPts.forEach((p, k) => { uv[k*2] = (p[0]-F.x)/F.w; uv[k*2+1] = (p[1]-F.y)/F.h; al[k] = k < N ? 1 : 0; });
  const idx = model.tri.flat();
  for (let k = 0; k < oval.length; k++){
    const a = oval[k], b = oval[(k+1)%oval.length], ra = N+k, rb = N+(k+1)%oval.length;
    idx.push(a, b, ra, b, rb, ra);
  }
  idxCount = idx.length;
  const buf = (data, loc, size) => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0); return b; };
  buf(uv, aUV, 2); buf(al, aA, 1);
  posBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(charPts.length*2), gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, IMG.face);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
}
const centroid = pts => { let x=0,y=0; pts.forEach(p => { x+=p[0]; y+=p[1]; }); return [x/pts.length, y/pts.length]; };
const expand = (p, c, k) => [c[0]+(p[0]-c[0])*k, c[1]+(p[1]-c[1])*k];

function drawFace(pts, w, h){
  if (glc.width !== w || glc.height !== h){ glc.width = w; glc.height = h; }
  gl.viewport(0, 0, w, h); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  const oval = model.oval, cu = centroid(oval.map(i => pts[i]));
  const all = pts.slice(0, N).concat(oval.map(i => expand(pts[i], cu, 1.16)));
  const arr = new Float32Array(all.length*2); all.forEach((p,k) => { arr[k*2]=p[0]; arr[k*2+1]=p[1]; });
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr);
  gl.uniform2f(uRes, w, h);
  gl.drawElements(gl.TRIANGLES, idxCount, gl.UNSIGNED_SHORT, 0);
}

/* ---------- head placement: least-squares affine char -> user ---------- */
const FIT = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109,1,168,33,263,6];
function solve3(M, v){ // Cramer's rule
  const d = m => m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1]) - m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0]) + m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
  const D = d(M); if (Math.abs(D) < 1e-9) return null;
  return [0,1,2].map(c => d(M.map((row,r) => row.map((x,k) => k===c ? v[r] : x))) / D);
}
function fitAffine(pts, flip){
  const L = flip ? model.lm.map(p => [model.W - p[0], p[1]]) : model.lm; let S=[[0,0,0],[0,0,0],[0,0,0]], bu=[0,0,0], bv=[0,0,0];
  for (const i of FIT){ const x=L[i][0], y=L[i][1], r=[x,y,1];
    for (let a=0;a<3;a++){ for (let b=0;b<3;b++) S[a][b]+=r[a]*r[b]; bu[a]+=r[a]*pts[i][0]; bv[a]+=r[a]*pts[i][1]; } }
  const U = solve3(S, bu), V = solve3(S, bv); if (!U || !V) return null;
  return [U[0], V[0], U[1], V[1], U[2], V[2]]; // a,b,c,d,e,f for ctx.transform
}

/* ---------- render ---------- */
function render(image, lms){
  const w = image.videoWidth || image.width, h = image.videoHeight || image.height;
  if (!w || !h) return;
  if (out.width !== w || out.height !== h){ out.width = w; out.height = h; }
  const mirror = facing === 'user';
  ctx.setTransform(1,0,0,1,0,0);
  if (mirror){ ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(image, 0, 0, w, h);
  ctx.setTransform(1,0,0,1,0,0);

  if (lms){
    lastFaceAt = performance.now();
    const raw = lms.map(p => [mirror ? (1-p.x)*w : p.x*w, p.y*h]);
    if (!smooth || smooth.length !== raw.length) smooth = raw.map(p => p.slice());
    else for (let i=0;i<raw.length;i++){ const s=smooth[i], r=raw[i];
      const d = Math.hypot(r[0]-s[0], r[1]-s[1]), k = Math.min(1, 0.45 + d/12);
      s[0]+= (r[0]-s[0])*k; s[1]+= (r[1]-s[1])*k; }
    const aff = fitAffine(smooth, mirror);
    if (aff){
      if (!smoothAff) smoothAff = aff.slice(); else for (let i=0;i<6;i++) smoothAff[i] += (aff[i]-smoothAff[i])*0.5;
      const A = smoothAff, base = ctx.getTransform();
      if (showSuit){
        const sc = Math.sqrt(Math.abs(A[0]*A[3]-A[1]*A[2]));
        const chin = model.lm[152], uc = smooth[152], S = model.suit;
        const cx = mirror ? model.W - chin[0] : chin[0];
        ctx.setTransform(base); ctx.translate(uc[0], uc[1]); ctx.scale(sc, sc);
        ctx.drawImage(IMG.suit, S.x - cx, S.y - chin[1]);
      }
      drawFace(smooth, w, h);
      ctx.setTransform(base); ctx.drawImage(glc, 0, 0);
      ctx.setTransform(base); ctx.transform(A[0],A[1],A[2],A[3],A[4],A[5]);
      ctx.drawImage(IMG.head, 0, 0);
    }
  }
  const noFace = performance.now() - lastFaceAt > 800;
  $('hint').textContent = statusMsg || (landmarker ? 'Inquadra il viso' : 'Carico il riconoscimento…');
  $('hint').hidden = !noFace && !statusMsg;
}

/* ---------- camera ---------- */
async function openCamera(){
  if (camStream) camStream.getVideoTracks().forEach(t => t.stop());
  const v = {facingMode: facing, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30}};
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video: v, audio: !micTrack});
  } catch(e){
    try { camStream = await navigator.mediaDevices.getUserMedia({video: v, audio: false}); }
    catch(e2){
      if (e2 && (e2.name === 'OverconstrainedError' || e2.name === 'NotReadableError')) camStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: facing}, audio: false});
      else throw e2;
    }
  }
  const a = camStream.getAudioTracks()[0]; if (a) micTrack = a;
  video.srcObject = new MediaStream(camStream.getVideoTracks());
  await video.play();
  smooth = null; smoothAff = null;
}
const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
let lastVT = -1, detErrors = 0, delegate = 'GPU', vision = null;
function detect(){
  if (video.currentTime === lastVT) return;
  lastVT = video.currentTime;
  try {
    const r = landmarker.detectForVideo(video, performance.now());
    const l = r && r.faceLandmarks && r.faceLandmarks[0];
    if (l){ lastLms = l; lmsAt = performance.now(); }
    detErrors = 0;
  } catch(e){
    console.error(e);
    if (++detErrors === 3){
      if (delegate === 'GPU'){ delegate = 'CPU'; busy = true; makeLandmarker().then(() => { busy = false; detErrors = 0; }).catch(err => status('Riconoscimento viso: ' + err.message)); }
      else status('Riconoscimento viso: ' + e.message);
    }
  }
}
function loop(){
  if (!running) return;
  if (video.readyState >= 2){
    if (landmarker && !busy) detect();
    try { render(video, performance.now() - lmsAt < 400 ? lastLms : null); } catch(e){ console.error(e); status('Errore filtro: ' + e.message); }
  }
  requestAnimationFrame(loop);
}
let statusMsg = '';
function status(m){ statusMsg = m; }
async function makeLandmarker(){
  if (landmarker){ try { landmarker.close(); } catch(e){} landmarker = null; }
  landmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {modelAssetPath: MODEL_URL, delegate},
    runningMode: 'VIDEO', numFaces: 1,
    minFaceDetectionConfidence: 0.4, minFacePresenceConfidence: 0.4, minTrackingConfidence: 0.4
  });
}
/* ---------- capture ---------- */
let recorder = null, chunks = [], recStart = 0, recTimer = null, holdTimer = null, lastBlob = null, lastName = '';
const MAX_SEC = 60;
function pickMime(){
  const c = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return c.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
}
function stamp(){ const d = new Date(), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
function takePhoto(){
  out.toBlob(b => { lastBlob = b; lastName = `sunday-miles-${stamp()}.jpg`; showResult(); }, 'image/jpeg', 0.92);
}
function startRec(){
  const stream = out.captureStream(30);
  if (micTrack && micTrack.readyState === 'live') stream.addTrack(micTrack);
  const mime = pickMime();
  try { recorder = new MediaRecorder(stream, mime ? {mimeType: mime, videoBitsPerSecond: 6e6} : undefined); }
  catch(e){ toast('Questo browser non registra video'); return; }
  chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const type = (recorder.mimeType || mime || 'video/webm').split(';')[0];
    lastBlob = new Blob(chunks, {type});
    lastName = `sunday-miles-${stamp()}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
    showResult();
  };
  recorder.start(250);
  recStart = performance.now();
  $('shutter').classList.add('rec');
  recTimer = setInterval(() => {
    const s = (performance.now()-recStart)/1000;
    $('timer').textContent = `0:${String(Math.floor(s)).padStart(2,'0')}`;
    $('prog').style.strokeDashoffset = 283 * (1 - Math.min(1, s/MAX_SEC));
    if (s >= MAX_SEC) stopRec();
  }, 100);
}
function stopRec(){
  if (!recorder || recorder.state === 'inactive') return;
  clearInterval(recTimer); recorder.stop();
  $('shutter').classList.remove('rec'); $('timer').textContent = ''; $('prog').style.strokeDashoffset = 283;
}
const sh = $('shutter');
sh.addEventListener('pointerdown', e => { e.preventDefault(); try { sh.setPointerCapture(e.pointerId); } catch(_){}
  holdTimer = setTimeout(() => { holdTimer = null; startRec(); }, 280); });
const release = () => { if (holdTimer){ clearTimeout(holdTimer); holdTimer = null; takePhoto(); } else stopRec(); };
sh.addEventListener('pointerup', release);
sh.addEventListener('pointercancel', () => { if (holdTimer){ clearTimeout(holdTimer); holdTimer = null; } else stopRec(); });
sh.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- result ---------- */
let objURL = null;
function showResult(){
  running = false;
  if (objURL) URL.revokeObjectURL(objURL);
  objURL = URL.createObjectURL(lastBlob);
  const m = $('media'); m.textContent = '';
  if (lastBlob.type.startsWith('image')){ const i = new Image(); i.src = objURL; i.alt = 'Foto con il filtro Sunday Miles'; m.append(i); }
  else { const v = document.createElement('video'); v.src = objURL; v.controls = true; v.playsInline = true; v.loop = true; v.autoplay = true; m.append(v); }
  const f = new File([lastBlob], lastName, {type: lastBlob.type});
  $('shareBtn').hidden = !(navigator.canShare && navigator.canShare({files:[f]}));
  $('result').hidden = false;
}
$('shareBtn').onclick = async () => {
  const f = new File([lastBlob], lastName, {type: lastBlob.type});
  try { await navigator.share({files:[f], title:'Sunday Miles', text:'#SundayMiles #SilentSystem'}); }
  catch(e){ if (e.name !== 'AbortError') toast('Condivisione non riuscita, usa Salva'); }
};
$('saveBtn').onclick = () => {
  const a = document.createElement('a'); a.href = objURL; a.download = lastName; document.body.append(a); a.click(); a.remove();
  toast('Salvato');
};
$('againBtn').onclick = () => {
  $('result').hidden = true; $('media').textContent = '';
  running = true; loop();
};

/* ---------- toggles ---------- */
$('suitBtn').onclick = () => { showSuit = !showSuit; $('suitBtn').setAttribute('aria-pressed', String(showSuit)); };
$('flipBtn').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user';
  try { await openCamera(); } catch(e){ facing = facing === 'user' ? 'environment' : 'user'; toast('Fotocamera non disponibile'); } };
let toastT; function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

/* ---------- boot ---------- */
async function boot(){
  try {
    await loadAssets();
    initGL();
    const mod = await import(MP_BASE + '/vision_bundle.mjs');
    FaceLandmarker = mod.FaceLandmarker;
    vision = await mod.FilesetResolver.forVisionTasks(MP_BASE + '/wasm');
    try { await makeLandmarker(); }
    catch(e){ console.warn('GPU non disponibile, uso CPU', e); delegate = 'CPU'; await makeLandmarker(); }
    $('startBtn').disabled = false; $('startBtn').textContent = 'Apri la fotocamera';
  } catch(e){
    console.error(e);
    $('startBtn').textContent = 'Errore';
    $('startErr').textContent = 'Il filtro non si è caricato (' + (e && e.message || e) + '). Ricarica la pagina.'; $('startErr').hidden = false;
  }
}
const UA = navigator.userAgent;
const inApp = /; wv\)|WhatsApp|Instagram|FBAN|FBAV|FB_IAB|Line\/|Telegram|TikTok|musical_ly|Snapchat/i.test(UA);
const chromeIntent = 'intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;end';
function showCamError(html){ $('startErr').innerHTML = html; $('startErr').hidden = false; }
if (inApp){
  showCamError('Sei nel browser interno di un\'app: qui la fotocamera non funziona.<br><a id="openChrome" href="' + chromeIntent + '" style="color:#ff6a13;font-weight:700">Apri in Chrome</a> oppure tocca ⋮ in alto e scegli "Apri in Chrome".');
}
$('startBtn').onclick = async () => {
  $('startBtn').disabled = true; $('startBtn').textContent = 'Avvio…';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('nomedia'), {name:'NoMedia'});
    await openCamera();
    $('start').hidden = true; ['topbar','controls'].forEach(id => $(id).hidden = false);
    running = true; loop();
  } catch(e){
    console.error(e);
    $('startBtn').disabled = false; $('startBtn').textContent = 'Riprova';
    const n = e && e.name || '';
    let msg;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') msg = 'La fotocamera funziona solo da un indirizzo https://.';
    else if (inApp || n === 'NoMedia') msg = 'Questo browser non dà accesso alla fotocamera. <a href="' + chromeIntent + '" style="color:#ff6a13;font-weight:700">Apri in Chrome</a>.';
    else if (n === 'NotAllowedError' || n === 'SecurityError') msg = 'Chrome ha bloccato la fotocamera per questo sito. Tocca l\'icona a sinistra dell\'indirizzo (lucchetto o impostazioni) → Autorizzazioni → Fotocamera → Consenti, poi tocca Riprova. Controlla anche Impostazioni Android → App → Chrome → Autorizzazioni → Fotocamera.';
    else if (n === 'NotReadableError' || n === 'AbortError' || n === 'TrackStartError') msg = 'La fotocamera è usata da un\'altra app o scheda. Chiudi le altre app che usano la fotocamera (e le altre schede del filtro), poi tocca Riprova.';
    else if (n === 'NotFoundError' || n === 'OverconstrainedError') msg = 'Non trovo una fotocamera utilizzabile su questo dispositivo.';
    else msg = 'Non riesco ad aprire la fotocamera.';
    showCamError(msg + '<br><span style="opacity:.6;font-size:12px">Codice: ' + (n || 'sconosciuto') + '</span>');
  }
};
boot();
})();
</script>
